<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Clone</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- NAVBAR START -->

    <nav class="navbar">

        <div class="logo">

            Flipkart

        </div>

        <div class="search">

            <input type="text" placeholder="Search for Products, Brands and More">

            <button>

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

        <div class="menu">

            <button class="login" id="loginBtn">
                Login
            </button>

            <a href="#">

                Become a Seller

            </a>

            <a href="#">

                More

            </a>

            <a href="#">

                <i class="fa-solid fa-cart-shopping"></i>

                Cart

            </a>

        </div>

    </nav>

    <!-- NAVBAR END -->


    <!-- CATEGORY START -->

    <section class="category">

        <div class="box">

            <img src="https://picsum.photos/100?1">

            <p>Grocery</p>

        </div>

        <div class="box">

            <img src="https://picsum.photos/100?2">

            <p>Mobiles</p>

        </div>

        <div class="box">

            <img src="https://picsum.photos/100?3">

            <p>Fashion</p>

        </div>

        <div class="box">

            <img src="https://picsum.photos/100?4">

            <p>Electronics</p>

        </div>

        <div class="box">

            <img src="https://picsum.photos/100?5">

            <p>Furniture</p>

        </div>

        <div class="box">

            <img src="https://picsum.photos/100?6">

            <p>Appliances</p>

        </div>

        <div class="box">

            <img src="https://picsum.photos/100?7">

            <p>Travel</p>

        </div>

    </section>

    <!-- CATEGORY END -->



    <!-- SLIDER START -->

    <section class="slider">

        <img id="banner" src="https://picsum.photos/1200/350?10">

    </section>

    <!-- SLIDER END -->


    <!-- PRODUCT SECTION -->

    <section class="products">

        <h2>Best Deals</h2>

        <div class="product-container">

            <div class="product">

                <img src="https://picsum.photos/200?11">

                <h3>Smart Phone</h3>

                <p>₹19,999</p>

                <button>Add To Cart</button>

            </div>

            <div class="product">

                <img src="https://picsum.photos/200?12">

                <h3>Laptop</h3>

                <p>₹59,999</p>

                <button>Add To Cart</button>

            </div>

            <div class="product">

                <img src="https://picsum.photos/200?13">

                <h3>Headphone</h3>

                <p>₹1,499</p>

                <button>Add To Cart</button>

            </div>

            <div class="product">

                <img src="https://picsum.photos/200?14">

                <h3>Watch</h3>

                <p>₹2,999</p>

                <button>Add To Cart</button>

            </div>

        </div>

    </section>

    <!-- Login Popup -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <span id="close">&times;</span>

            <h2>Login</h2>

            <input type="email" placeholder="Enter Email">

            <input type="password" placeholder="Enter Password">

            <button>Login</button>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        Copyright © 2026 Flipkart Clone

    </footer>


    <script src="script.js"></script>

</body>

</html>
