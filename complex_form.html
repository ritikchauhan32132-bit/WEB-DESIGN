<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    

    <h2>Complex Form</h2>
    
    <form>

        <fieldset>
            <legend>Personsal Information</legend>

            <label for="name">Name: </label>
            <input type="text" placeholder="Name" required id="name">
            <label for="email">Email: </label>
            <input type="email" required placeholder="Email" id="email">
            <label for="phone">Phone: </label>
            <input type="tel" required placeholder="XXXXXXXXXX" id="phone">
            <label for="Date">Date of Birth:</label>
            <input type="date" required id="Date">
            <label for="gender">gender: </label>
            <input type="radio" id="male" required>
            <label for="male">Male </label>
            <input type="radio" id="female" required>
            <label for="male">Female </label>
            <input type="radio" id="other" required>
            <label for="other">other </label>
            <label for="country">COUNTRY: </label>
            <select name="select" id="country:">
                <option value="OTHER">OTHER</option>
                <option value="INDIA">INDIA</option>
                <option value="UK">UK</option>
                <option value="USA">USA</option>
                <option value="NEPAL">NEPAL</option>
            </select>
            <br>
            <br>
        </fieldset>

        <br>
        <br>
        <fieldset>
            <legend>Address Street</legend>

            <label for="city">City: </label>
            <input type="text" placeholder="City" required id="city">
            <label for="state">State: </label>
            <input type="text" placeholder="State" required id="state">
            <label for="code">ZIP Code: </label>
            <input type="text" placeholder="ZIP Code" required id="code">


        </fieldset>

        <br><br>

        <fieldset>

            <legend>other Information</legend>
            <label for="comment">Comment: </label>
            <textarea name="comment" id="comment"></textarea>
            <label for="selector">I agree to the terms of service: </label>
            <input type="checkbox" required id="selector">




        </fieldset>
        <br><br>
        <input type="submit">

    </form>


</body>
</html>
